<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex">
<title>Pixel Territory 서버 상태</title>
<link rel="icon" href="/icon-192.png">
<!-- 서버 통계 (server/stats.py, /api/dashboard를 5초마다). 숫자만 보여 준다: 판 번호·이름·방 코드·IP는 없다. -->
<style>
  :root { --bg: #0c0e14; --panel: #161a23; --line: #2c3240; --ink: #eee8d6; --dim: #a9a69c; --gold: #ffd678; --teal: #4cc9b8; --red: #ff8a74; }
  * { box-sizing: border-box; }
  body { margin: 0; background: var(--bg); color: var(--ink); font: 14px/1.5 'Malgun Gothic', 'Apple SD Gothic Neo', system-ui, sans-serif; }
  main { max-width: 1080px; margin: 0 auto; padding: 24px 16px 40px; }
  header { display: flex; flex-wrap: wrap; align-items: baseline; justify-content: space-between; gap: 8px; margin-bottom: 18px; }
  h1 { margin: 0; font-size: 22px; color: var(--gold); text-shadow: 1px 2px 0 #000; }
  h2 { margin: 0 0 10px; font-size: 15px; color: var(--gold); }
  .meta { color: var(--dim); font-size: 13px; }
  .tiles { display: grid; grid-template-columns: repeat(auto-fit, minmax(170px, 1fr)); gap: 10px; margin-bottom: 14px; }
  .tile, .panel { background: var(--panel); border: 1px solid var(--line); outline: 2px solid #000; }
  .tile { padding: 12px 14px; }
  .tile .k { color: var(--dim); font-size: 12px; }
  .tile .v { font-size: 26px; font-weight: bold; margin-top: 2px; }
  .tile .v small { font-size: 14px; color: var(--dim); font-weight: normal; }
  .panel { padding: 14px 16px; margin-bottom: 14px; }
  .grid2 { display: grid; grid-template-columns: 1fr 1fr; gap: 14px; }
  @media (max-width: 760px) { .grid2 { grid-template-columns: 1fr; } }
  .bar { margin: 8px 0 12px; }
  .bar .top { display: flex; justify-content: space-between; gap: 8px; font-size: 13px; }
  .bar .top b { font-weight: normal; color: var(--dim); }
  .track { height: 10px; background: #0a0c11; border: 1px solid var(--line); margin-top: 4px; }
  .fill { height: 100%; background: var(--teal); transition: width 0.4s; }
  .fill.warm { background: var(--gold); } .fill.hot { background: var(--red); }
  .chart { width: 100%; height: 180px; display: block; }
  .legend { display: flex; gap: 14px; font-size: 12px; color: var(--dim); margin-top: 6px; }
  .legend i { display: inline-block; width: 10px; height: 10px; margin-right: 5px; vertical-align: -1px; }
  .scroll { overflow-x: auto; }
  table { width: 100%; border-collapse: collapse; font-size: 13px; }
  th, td { padding: 6px 8px; text-align: right; border-bottom: 1px solid var(--line); white-space: nowrap; }
  th:first-child, td:first-child { text-align: left; }
  th { color: var(--dim); font-weight: normal; }
  .empty { color: var(--dim); padding: 10px 0; }
  .tag { display: inline-block; padding: 0 6px; border: 1px solid var(--line); font-size: 12px; }
  .tag.multi { color: var(--gold); border-color: #6b5a30; }
  .note { color: var(--dim); font-size: 12px; margin-top: 6px; }
</style>
</head>
<body>
<main>
  <header>
    <h1>Pixel Territory 서버 상태</h1>
    <div class="meta" id="meta">불러오는 중...</div>
  </header>

  <section class="tiles" id="tiles"></section>

  <div class="grid2">
    <section class="panel">
      <h2>서버 사용량</h2>
      <div id="usage"></div>
    </section>
    <section class="panel">
      <h2>최근 14일</h2>
      <svg class="chart" id="chart" viewBox="0 0 500 180" preserveAspectRatio="none" role="img" aria-label="최근 14일 순 방문자와 시작한 판"></svg>
      <div class="legend"><span><i style="background:var(--gold)"></i>순 방문자</span><span><i style="background:var(--teal)"></i>시작한 판</span></div>
    </section>
  </div>

  <section class="panel">
    <h2>돌아가는 판</h2>
    <div class="scroll" id="games"></div>
  </section>

  <section class="panel">
    <h2>날짜별</h2>
    <div class="scroll" id="days"></div>
    <div class="note">날짜는 한국 시간. 순 방문자는 그날 페이지를 연 서로 다른 사람 수 (IP는 저장하지 않는다). 판은 그날 새로 시작한 판.</div>
  </section>
</main>
<script>
const $ = (id) => document.getElementById(id);
const esc = (s) => String(s).replace(/[&<>"]/g, (c) => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c]));
const mb = (b) => (b == null ? '-' : b >= 1 << 30 ? `${(b / (1 << 30)).toFixed(1)} GB` : `${Math.round(b / (1 << 20))} MB`);
const dur = (s) => { const d = Math.floor(s / 86400), h = Math.floor(s / 3600) % 24, m = Math.floor(s / 60) % 60; return d ? `${d}일 ${h}시간` : h ? `${h}시간 ${m}분` : `${m}분`; };

function tile(k, v, sub = '') { return `<div class="tile"><div class="k">${k}</div><div class="v">${v}${sub ? ` <small>${sub}</small>` : ''}</div></div>`; }

function bar(label, value, pct, note = '') {
  const p = pct == null ? 0 : Math.max(0, Math.min(100, pct));
  const cls = p >= 85 ? 'hot' : p >= 60 ? 'warm' : '';
  return `<div class="bar"><div class="top"><span>${label}</span><b>${value}${note ? ` · ${note}` : ''}</b></div>
    <div class="track"><div class="fill ${cls}" style="width:${p}%"></div></div></div>`;
}

function chart(days) {
  const W = 500, H = 180, pad = 18, n = days.length, bw = (W - pad) / n;
  const games = days.map((d) => d.single + d.multi);
  const top = Math.max(1, ...days.map((d) => d.visitors), ...games);
  let s = `<line x1="0" y1="${H - pad}" x2="${W}" y2="${H - pad}" stroke="#2c3240"/>`;
  days.forEach((d, i) => {
    const x = i * bw + 4, w = (bw - 8) / 2, h1 = ((H - pad - 14) * d.visitors) / top, h2 = ((H - pad - 14) * games[i]) / top;
    s += `<rect x="${x}" y="${H - pad - h1}" width="${w}" height="${h1}" fill="#ffd678"><title>${d.date} 순 방문자 ${d.visitors}</title></rect>`;
    s += `<rect x="${x + w}" y="${H - pad - h2}" width="${w}" height="${h2}" fill="#4cc9b8"><title>${d.date} 판 ${games[i]}</title></rect>`;
    if (i % 2 === n % 2 || i === n - 1) s += `<text x="${x + w}" y="${H - 4}" font-size="10" fill="#a9a69c" text-anchor="middle">${d.date.slice(5)}</text>`;
  });
  $('chart').innerHTML = s;
}

function render(d) {
  const today = d.days[d.days.length - 1];
  const running = d.games.filter((g) => !g.over).length;
  $('tiles').innerHTML =
    tile('지금 접속자', d.clients, `/ ${d.limits.clients}`) +
    tile('돌아가는 판', running, `/ ${d.limits.games}`) +
    tile('멀티 대기실', d.rooms_waiting, `/ ${d.limits.rooms}`) +
    tile('오늘 순 방문자', today.visitors, `방문 ${today.visits}`) +
    tile('오늘 시작한 판', today.single + today.multi, `싱글 ${today.single} · 멀티 ${today.multi}`) +
    tile('오늘 최대 동시 접속', today.peak_clients);
  const u = d.usage;
  const steps = d.games.filter((g) => !g.over).map((g) => g.step_ms);
  const stepSum = steps.reduce((a, b) => a + b, 0);
  $('usage').innerHTML =
    bar('CPU (서버 전체)', u.cpu == null ? '-' : `${u.cpu}%`, u.cpu, u.cores ? `코어 ${u.cores}개` : '') +
    bar('CPU (게임 서버)', u.proc_cpu == null ? '-' : `${u.proc_cpu}%`, u.proc_cpu == null || !u.cores ? null : u.proc_cpu / u.cores, '코어 하나 = 100%') +
    bar('메모리 (서버 전체)', u.mem_total ? `${mb(u.mem_used)} / ${mb(u.mem_total)}` : '-', u.mem_total ? (100 * u.mem_used) / u.mem_total : null) +
    bar('메모리 (게임 서버)', mb(u.proc_mem), u.mem_total && u.proc_mem ? (100 * u.proc_mem) / u.mem_total : null) +
    bar('판 계산 시간 (모든 판 합)', `${stepSum.toFixed(1)} ms`, (100 * stepSum) / d.step_budget_ms, `한 걸음 ${d.step_budget_ms} ms 안에 끝나야 매끄럽다`) +
    `<div class="note">부하 (1·5·15분): ${u.load ? u.load.join(' · ') : '-'}</div>`;
  chart(d.days);
  $('games').innerHTML = d.games.length ? `<table><tr><th>종류</th><th>사람 (접속 / 전체)</th><th>나라 (남음 / 전체)</th><th>진행</th><th>걸음 계산</th><th>상태</th></tr>` +
    d.games.map((g) => `<tr><td><span class="tag ${g.multi ? 'multi' : ''}">${g.multi ? '멀티' : '싱글'}</span></td>
      <td>${g.online} / ${g.humans}</td><td>${g.alive} / ${g.nations}</td><td>${g.minutes}분</td><td>${g.step_ms} ms</td>
      <td>${g.over ? '끝남' : g.online ? '진행 중' : '모두 끊김'}</td></tr>`).join('') + '</table>'
    : '<div class="empty">지금 돌아가는 판이 없습니다</div>';
  $('days').innerHTML = `<table><tr><th>날짜</th><th>순 방문자</th><th>방문</th><th>싱글</th><th>멀티</th><th>최대 동시 접속</th></tr>` +
    d.days.slice().reverse().map((x) => `<tr><td>${esc(x.date)}</td><td>${x.visitors}</td><td>${x.visits}</td><td>${x.single}</td><td>${x.multi}</td><td>${x.peak_clients}</td></tr>`).join('') + '</table>';
  $('meta').textContent = `켜진 지 ${dur(u.uptime)} · ${new Date().toLocaleTimeString('ko-KR')} 갱신 (5초마다)`;
}

async function load() {
  try { render(await (await fetch('/api/dashboard', { cache: 'no-store' })).json()); }
  catch { $('meta').textContent = '서버에 닿지 못했습니다. 다시 시도하는 중...'; }
}
load();
setInterval(load, 5000);
</script>
</body>
</html>
